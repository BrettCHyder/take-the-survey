<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-labelledby="title desc"><title id="title">One Dollar Survey</title><desc id="desc">Would you pay a dollar to take this survey? No is free. Yes costs one dollar. Take the survey at OneDollarSurvey.com.</desc><rect x="1" y="1" width="598" height="188" rx="16" fill="#f6f5ef" stroke="#bac5ac" stroke-width="2"/><g fill="#222720" font-family="Arial, Helvetica, sans-serif"><text x="26" y="36" font-size="13" font-weight="bold" letter-spacing="2">ONE QUESTION. REALLY.</text><text x="26" y="76" font-size="26" font-weight="bold">Would you pay a dollar</text><text x="26" y="108" font-size="26" font-weight="bold">to take this survey?</text><text x="26" y="151" font-size="15">No is free. Yes costs $1.</text><text x="26" y="176" font-size="12" fill="#68735c">OneDollarSurvey.com</text></g><rect x="439" y="63" width="132" height="61" rx="8" fill="#d1ee85"/><text x="505" y="100" text-anchor="middle" font-size="16" font-weight="bold" font-family="Arial, sans-serif" fill="#222720">Take it →</text></svg>